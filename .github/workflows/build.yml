name: build

on:
  workflow_dispatch:
    inputs:
      restore_cache:
        description: 'Restore Gradle cache prior to building'
        required: false
        type: boolean
        default: true
      save_cache:
        description: 'Save Gradle cache after building'
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - '**/*'
      - '!**/*.md'
      - '!.github/**'
      - .github/workflows/build.yml
  schedule:
    - cron: '0 11 * * *' # Run nightly at 11am UTC (3am Pacific, 6am Eastern)

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
    run:
      shell: bash

jobs:
  build:
    continue-on-error: false
    runs-on: ubuntu-latest

    steps:
      - name: actions/checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          show-progress: false

      - name: actions/setup-java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: 25
          distribution: temurin

      - name: Restore Gradle Cache
        uses: actions/cache/restore@d4323d4df104b026a6aa633fdb11d772146be0bf # 4.2.2
        if: (github.event_name == 'workflow_dispatch' && inputs.restore_cache) || (github.event_name != 'workflow_dispatch' && github.event_name != 'schedule')
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-z8nasm5z3z-${{ github.run_id }}
          restore-keys: |
            gradle-cache-z8nasm5z3z-

      - name: assembleDebug
        run: ./gradlew --warning-mode all assembleDebug

      - name: Save Gradle Cache
        uses: actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf # 4.2.2
        if: (github.event_name == 'workflow_dispatch' && inputs.save_cache) || (github.event_name == 'schedule')
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-z8nasm5z3z-${{ github.run_id }}
